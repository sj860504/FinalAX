name: 작업
description: 내 영역에서 할 일 하나. 2시간 안에 끝나는 크기.
title: "[영역] 동사로 시작하는 한 문장"
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역 (라벨도 같이 붙일 것)
      options: [backend, frontend, shared, demo]
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options: ["P1 (데모 필수)", "P2 (있으면 좋음)"]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: 무엇을
      description: 화면/엔드포인트 기준으로. 계약 문서 항목이 있으면 링크.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: curl 또는 화면으로 확인 가능한 체크박스
      value: |
        - [ ] 
        - [ ] 
    validations: { required: true }
  - type: markdown
    attributes:
      value: "> 담당자(Assignees)를 반드시 지정한다. 담당자 없는 이슈는 작업하지 않는다."
