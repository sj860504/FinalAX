# PR 마다 실행. 셋 다 통과해야 main 머지 가능(브랜치 보호). main 머지 = 릴리즈(Space 배포).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Import app and list routes
        run: python -c "import app.main; print([r.path for r in app.main.app.routes])"
      - name: Tests (if any)
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then pip install pytest httpx && pytest -q; else echo "no tests"; fi

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm build
        env: { VITE_API_BASE_URL: "" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (same as Space)
        run: docker build -t finalax:ci .
      - name: Smoke /health
        run: |
          docker run -d --name fx -p 7860:7860 finalax:ci
          for i in $(seq 1 30); do curl -sf localhost:7860/health && exit 0; sleep 1; done
          docker logs fx; exit 1
