# main 에 머지되면 Hugging Face Space 로 그대로 푸시 → Space 가 Dockerfile 로 다시 빌드.
# 필요한 GitHub Secrets: HF_TOKEN (write 권한), HF_SPACE (예: sj860504/finalax)
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN / HF_SPACE secret 이 없어 배포를 건너뜁니다."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Space 저장소는 GitHub 과 히스토리가 다르므로 Space 쪽 main 만 덮어쓴다 (GitHub main 은 건드리지 않음)
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
